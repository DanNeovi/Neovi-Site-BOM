/* Catalog application layout */
:root{background:#f5f7fb;--border:#d8e0eb;--muted:#596b83;--green:#2053a4}
.shell{display:block;min-height:100vh}
.appbar{background:#fff;border-bottom:1px solid #d9e2ee;box-shadow:0 2px 10px #243d6310}

.header-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

const qtyNumber=value=>Number(value).toLocaleString('en-US',{maximumFractionDigits:3});
function rowQuantity(item){const entered=progressFor(item).quantity;if(entered!=null)return {value:entered,source:'site entry'};if(item.checklistSource&&item.listedQuantity!=null)return {value:item.listedQuantity,source:'user supplied'};const estimate=item.monroeEstimate;if(estimate&&estimate.basis!=='PLANNING_PLACEHOLDER'&&(!item.checklistSource||sheetReferenceCounts.get(item.originalLineId)===1))return {value:estimate.quantity,source:estimate.basis==='PLANNING_CONDITIONAL_ZERO'?'Monroe conditional':'Monroe estimate'};return {value:null,source:'not estimated'}}
function shownQuantity(rows){const values=rows.map(rowQuantity),known=values.filter(v=>v.value!=null);if(!known.length){const first=rows[0];if(rows.length>1&&first.checklistSource&&first.originalLineId&&rows.every(r=>r.checklistSource&&r.originalLineId===first.originalLineId&&r.monroeEstimate&&r.monroeEstimate.basis!=='PLANNING_PLACEHOLDER'))return {text:qtyNumber(first.monroeEstimate.quantity),source:'Monroe shared total'};return {text:'N/A',source:'not estimated'}}const bySource=new Map();for(const item of known)bySource.set(item.source,(bySource.get(item.source)||0)+item.value);const unknown=rows.length-known.length;const parts=[...bySource].map(([source,value])=>bySource.size===1?qtyNumber(value):qtyNumber(value)+' '+source);return {text:parts.join(' + ')+(unknown?' + N/A':''),source:bySource.size===1?known[0].source:'mixed sources'}}
const normalized=value=>String(value||'').toLowerCase().replace(/\s+/g,' ').trim();
const specified=value=>Boolean(normalized(value))&&!/tbd|confirm|not specified|not supplied|unspecified|n\/a|approve exact|pending|placeholder|remaining specification|selected|match voltage|compatible with/i.test(value);
function purchaseKey(i){const unit=normalized(i.unit),prefix=i.inventoryPrefix||'';if(i.purchaseType)return JSON.stringify(['sheet-type',i.purchaseType,unit]);if(specified(i.partNumber))return JSON.stringify(['part',specified(i.vendor)?normalized(i.vendor):(i.lineId||i.itemId||i.description),normalized(i.partNumber),unit]);if(specified(i.specification))return JSON.stringify(['spec',prefix,purchaseFamily(i),normalized(i.specification),unit]);return JSON.stringify(['name',prefix,normalized(i.vendor),normalized(i.description),unit])}
function purchaseGroups(items){const groups=new Map();items.forEach(i=>{const key=purchaseKey(i);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(i)});return [...groups.values()]}
function purchaseFamily(i){const name=i.description.toLowerCase();if(/screw(?!driver)/.test(name))return 'Screws';if(/washers.*nuts|nuts.*washers/.test(name))return 'Washer and nut sets';if(/\bwashers?\b/.test(name))return 'Washers';if(/\bnuts?\b/.test(name))return 'Nuts';if(/\bbolts?\b/.test(name))return 'Bolts';if(/froth.?pak|foam/.test(name))return 'Foam and applicator supplies';return codeIndex[i.inventoryPrefix]?.[0]||'Other parts'}
function orderingList(items){const placeholders=items.filter(i=>/^Define\b/i.test(i.description));items=items.filter(i=>!/^Define\b/i.test(i.description));const families=new Map();purchaseGroups(items).forEach(rows=>{const family=purchaseFamily(rows[0]);if(!families.has(family))families.set(family,[]);families.get(family).push(rows)});return '<p class="note">All phases combined by part type. Quantities labeled Monroe estimate are project planning values, not approved order quantities. User-provided quantities retain their listed values. N/A remains where no defensible value exists; repeated sheet uses of one catalog item share a single Monroe total.</p>'+[...families].sort(([a],[b])=>a.localeCompare(b)).map(([name,entries])=>'<h2 class="group-title">'+esc(name)+' <span class="group-count">'+entries.length+' ordering entries</span></h2><div class="compact-list">'+entries.sort((a,b)=>a[0].description.localeCompare(b[0].description)).map(rows=>{const i=rows[0],title=rows.length>1&&specified(i.partNumber)?i.partNumber:rows.length>1&&specified(i.specification)?i.specification:i.description,qty=shownQuantity(rows);return '<details class="material-entry"><summary><span>'+esc(title)+'<small>'+esc([...new Set(rows.map(r=>r.phase+' / '+r.stage))].join(' ; '))+' / '+rows.length+' use'+(rows.length===1?'':'s')+(!specified(i.specification)&&!specified(i.partNumber)?' / Specification needed':'')+'</small></span><span class="entry-unit">'+esc(qty.text)+'<small>'+esc(i.unit+' · '+qty.source)+'</small></span></summary>'+rows.map(row=>'<p class="source-item">'+esc(row.catalogId)+' / '+esc(row.description)+'</p>').join('')+inlineDetails(rows)+'</details>'}).join('')+'</div>').join('')+(placeholders.length?'<details class="extra-catalog"><summary>Items still to define ('+placeholders.length+')</summary>'+compactList(placeholders)+'</details>':'')}
function spreadsheet(items){const ordered=[...items].sort((a,b)=>(a.phaseOrder??999)-(b.phaseOrder??999)||(a.stageOrder??999)-(b.stageOrder??999)||sourceOrder(a,b));const headers=['#','Item','Code','Phase','Work area','Group','Plan qty','Qty source','Listed qty','Site qty','Unit','Checked','Specification','Vendor','Part number','Notes'];return '<div class="sheet-wrap" role="region" tabindex="0" aria-label="Site BOM table"><table class="sheet-table"><thead><tr>'+headers.map((h,n)=>'<th class="'+(n===0?'sheet-index':n===1?'sheet-item':'')+'">'+h+'</th>').join('')+'</tr></thead><tbody>'+ordered.map((i,n)=>{const qty=shownQuantity([i]),p=progressFor(i);const cells=[n+1,i.description,i.lineId,i.phase,i.stage,checklistGroup(i),qty.text,qty.source,i.listedQuantity??'',p.quantity??i.siteQuantity??'',i.unit,p.done?'Yes':'',i.specification||'',i.vendor||'',i.partNumber||'',i.itemNotes||''];return '<tr>'+cells.map((value,index)=>'<td class="'+(index===0?'sheet-index':index===1?'sheet-item':index===6||index===8||index===9?'sheet-num':index===15?'sheet-notes':'')+'" title="'+esc(value)+'">'+(index===1?'<button data-detail="'+esc(i.lineId)+'">'+esc(value)+'</button>':esc(value))+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div><p class="sheet-legend"><span><strong>'+ordered.length+' rows</strong> · drag to select and copy cells</span><span>Plan quantities are labeled by source and are not approved order quantities.</span><span>Blank means unknown.</span></p>'}
function printPhase(){
 if(!state.phase&&state.presentation!=='ordering')return;
 const saved={...state,path:[...state.path]},title=document.title;
 try{
  state.path=[];state.query='';render();
  $('printReport').innerHTML='<header><p>Site Bill of Material</p><h1>'+esc(state.phase||'Combined ordering list')+'</h1><p>'+data.items.filter(i=>!state.phase||i.phase===state.phase).length+' materials / Catalog snapshot '+esc(new Date(data.viewerGeneratedAt||data.generatedAt).toLocaleDateString())+'</p></header>'+$('content').innerHTML+'<footer class="print-legend"><strong>Code index:</strong> '+Object.entries(codeIndex).map(([code,[name]])=>esc(code)+' = '+esc(name)).join(' / ')+'</footer>';
 }finally{Object.assign(state,saved);render()}
 $('printReport').querySelectorAll('details').forEach(d=>d.open=true);
 document.title='Site Bill of Material - '+(state.phase||'Combined ordering list');
 try{window.print()}finally{document.title=title;$('printReport').innerHTML=''}
}
function render(){
 document.body.classList.toggle('table-mode',state.view==='catalog'&&state.presentation==='grid');
 const pileSchedule=data.pileSchedule;
 $('pileScheduleNotice').hidden=state.view!=='catalog'||!pileSchedule;
 if(pileSchedule){$('pileScheduleSummary').textContent=`Structural pile schedule: ${pileSchedule.totalPiles} piles by diameter · confirm before purchase`;$('pileScheduleText').textContent=`${pileSchedule.byDiameter.map(row=>`${row.count} at ${row.diameterIn} diameter`).join(', ')}. Source: ${pileSchedule.sourceDocument}, page ${pileSchedule.sourcePage}. Confirm pile specifications and approved drawing revision before purchase.`;}
 $('navigation').innerHTML=topFolders.map(f=>'<button class="nav-folder" data-root="'+esc(f)+'"'+(state.view==='catalog'&&state.path[0]===f?' aria-current="page"':'')+'>'+esc(f)+'</button>').join('');
 document.querySelectorAll('.header-link[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===state.view));
 $('materialControls').hidden=state.view!=='catalog';
 $('viewModes').innerHTML=[['grid','Table'],['ordering','Combined ordering list'],['phase','By phase: tools & materials']].map(([value,name])=>'<button data-presentation="'+value+'" class="'+(state.presentation===value?'active':'')+'" aria-pressed="'+(state.presentation===value)+'">'+name+'</button>').join('');
 $('phases').hidden=state.presentation==='ordering';
 $('heading').textContent=state.view==='catalog'?(state.presentation==='grid'?'Materials table':state.presentation==='ordering'?'Combined ordering list':state.path.at(-1)||state.phase||'Material catalog'):state.view==='documents'?'Documents':'How to use';
 $('intro').textContent=state.view==='catalog'?(state.presentation==='grid'?'Browse and copy the full materials table. Open an item for its source details; use the shared editor to change rows.':state.phase?'Full phase inventory, organized using the BOM Skeleton layout. Work packages show all materials, tools, and consumables; click an item for details.':(state.presentation==='ordering'?'Matching parts combined across work areas, with quantities from your checklist and later directions.':'Browse category folders or select a phase to see all its materials.')):state.view==='documents'?'Browse supporting files by folder. Older catalog and project exports do not include the BOM Skeleton checklist additions.':'Find materials, specifications, and catalog information.';
 $('footnote').textContent='Catalog snapshot: '+new Date(data.viewerGeneratedAt||data.generatedAt).toLocaleDateString()+'.';
 if(state.view==='documents'){$('content').innerHTML='<div class="controls"><input id="docSearch" type="search" aria-label="Search documents" placeholder="Search files in this folder..." value="'+esc(state.docQuery)+'"></div><div id="docList"></div>';renderDocs();$('docSearch').oninput=e=>{state.docQuery=e.target.value;renderDocs()};return}
 if(state.view==='reference'){$('content').innerHTML='<div class="reference"><h2>Everything in its folder</h2><p>Start with a catalog folder, then open its subfolders to find related materials. The folder path above the contents takes you back to any parent folder.</p><p>Select Foundation, Panels, or Finishing to see every material in that phase immediately, grouped by work area in installation order. Search looks through the current folder and all its subfolders.</p><p>On WorkNeovi, Edit site progress opens the shared editor for signed-in users with SiteBOM edit access. In an offline copy, progress is saved in this browser and can be exported as CSV. Catalog estimates stay unchanged.</p><p>Select a material for its specification, vendor, part number, and catalog rules. Documents are also organized into folders.</p></div>';return}
 $('phases').innerHTML=['',...new Set(data.items.map(i=>i.phase))].map(p=>'<button data-phase="'+esc(p)+'" aria-pressed="'+(p===state.phase)+'" class="'+(p===state.phase?'active':'')+'">'+esc(p||'All phases')+'</button>').join('');
 const items=selectedItems(),depth=state.path.length,children=[...new Set(items.map(i=>itemPath(i)[depth]).filter(Boolean))].sort();
 let body=crumbs(state.path,'data-depth','Catalog')+'<div class="listhead"><span role="status">'+items.length+' entries'+(state.phase?' / '+esc(state.phase):'')+' · '+items.filter(i=>progressFor(i).done).length+' checked</span><div class="list-actions">'+(state.phase||state.presentation==='ordering'?'<button class="quiet" data-print>Print / Save PDF - '+esc(state.phase||'All items')+'</button>':'')+'<button class="quiet" data-export-progress>Export progress CSV</button><button class="quiet" data-code-index>Code index</button><button class="quiet" data-reset>Reset filters</button></div></div>';
 if(items.some(i=>i.checklistSource))body+='<p class="note">'+(state.presentation==='grid'?'Quantity source has its own column. User-provided values are preserved; unlinked or ambiguous entries remain N/A.':'Quantity source appears below each number. User-provided values are preserved; Monroe estimates fill uniquely mapped blanks. Unlinked or ambiguous entries remain N/A.')+'</p>';
 if(!items.length)body+='<div class="empty">No matching materials. Try another search or reset the filters.</div>';
 else if(state.presentation==='grid'){body+=spreadsheet(items)}
 else if(state.presentation==='ordering'){body+=orderingList(items)}
 else if(state.query||state.phase){const groups=new Map();const ordered=[...items].sort((a,b)=>(a.phaseOrder??999)-(b.phaseOrder??999)||(a.stageOrder??999)-(b.stageOrder??999)||sourceOrder(a,b));ordered.forEach(i=>{const key=i.phase+' / '+(i.stage||'Unassigned work area');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(i)});body+='<div class="stage-links" aria-label="Jump to work area">'+[...groups].map(([name,rows],n)=>'<a href="#work-area-'+n+'">'+esc(state.phase?rows[0].stage:name)+' <small>'+rows.length+'</small></a>').join('')+'</div>';body+=[...groups].map(([name,rows],n)=>'<section id="work-area-'+n+'" class="work-area"><h2 class="group-title">'+esc(name)+' <span class="group-count">'+rows.length+' entries</span></h2>'+table(rows,name==='Foundation / Shared Foundation Support')+'</section>').join('')}

 else{body+='<div class="folder-grid">'+children.map(name=>folder(name,items.filter(i=>itemPath(i)[depth]===name).length+' materials','data-folder',name)).join('')+'</div>';const direct=items.filter(i=>itemPath(i).length===depth);if(direct.length)body+='<h2 class="group-title">Materials in this folder</h2>'+table(direct)}
  $('content').innerHTML=body;
  attachSheetNavigation();
}
function attachSheetNavigation(){
 const wrap=$('content').querySelector('.sheet-wrap');
 if(!wrap)return;
 const nav=document.createElement('div');
 nav.className='sheet-nav';
 nav.innerHTML='<span>Swipe sideways in the table to see more columns, or use these buttons.</span><button class="quiet" type="button" data-sheet-scroll="-1" aria-label="Previous table columns">← Previous</button><button class="quiet" type="button" data-sheet-scroll="1" aria-label="Next table columns">Next →</button>';
 wrap.before(nav);
 nav.addEventListener('click',e=>{const button=e.target.closest('[data-sheet-scroll]');if(button)wrap.scrollBy({left:Number(button.dataset.sheetScroll)*Math.max(180,wrap.clientWidth*.8),behavior:'smooth'})});
}
// Project reports remain in the delivery package; this catalog only lists shared resources.
const documents=data.documents.filter(d=>!d.path.startsWith('02-Projects/'));
function renderDocs(){const depth=state.docPath.length,docs=documents.filter(d=>startsWith(d.path.split('/'),state.docPath)&&d.path.toLowerCase().includes(state.docQuery.toLowerCase()));const folders=[...new Set(docs.filter(d=>d.path.split('/').length>depth+1).map(d=>d.path.split('/')[depth]))].sort();const files=state.docQuery?docs:docs.filter(d=>d.path.split('/').length===depth+1);
 $('docList').innerHTML=crumbs(state.docPath,'data-doc-depth','Documents')+'<div class="listhead" role="status">'+docs.length+' files</div>'+(!state.docQuery?'<div class="folder-grid">'+folders.map(f=>folder(f.replace(/^\d+-/,''),docs.filter(d=>d.path.split('/')[depth]===f).length+' files','data-doc-folder',f)).join('')+'</div>':'')+'<div class="docs">'+files.map(d=>'<a class="doc" href="'+d.path.split('/').map(encodeURIComponent).join('/')+'" target="_blank" rel="noopener"><small>'+esc(d.path.split('/').slice(0,-1).join(' / '))+'</small>'+esc(d.name)+'</a>').join('')+'</div>'+(!docs.length?'<div class="empty">No matching documents.</div>':'')}
function openItem(id){const i=data.items.find(i=>i.lineId===id);$('detailContent').innerHTML='<div class="eyebrow">'+esc(i.catalogId)+' / '+esc(i.phase)+'</div><h2 id="detailTitle">'+esc(i.description)+'</h2><p class="intro">'+esc(itemPath(i).join(' / '))+'</p><h3>Used for / notes</h3><p class="usage-description">'+esc(usedFor(i))+'</p><h3>Belongs to</h3>'+fields({phase:i.phase,workArea:i.stage,system:i.system,kit:i.kitId,siteTeam:i.siteTeam,deliveryStage:i.deliveryStage})+'<h3>Specification</h3>'+fields({specification:i.specification,approved:i.specificationApproved,unit:i.unit,vendor:i.vendor,partNumber:i.partNumber})+'<details><summary>Catalog information</summary>'+fields({system:i.system,owner:i.owner,procurementMethod:i.procurementMethod,itemNotes:i.itemNotes,lineNotes:i.lineNotes})+'</details><details><summary>Quantity rules</summary>'+fields({quantityBasis:i.quantityBasis,takeoffFormula:i.takeoffFormula,packSize:i.packSize,ruleStatus:i.ruleStatus})+'</details><details><summary>Advanced catalog data</summary>'+fields(i)+'</details>';$('detail').showModal()}
function openProgress(id){const i=data.items.find(row=>row.lineId===id),p=progressFor(i);$('detailContent').innerHTML='<h2 id="detailTitle">'+esc(i.description)+'</h2><p class="intro">'+esc(i.phase+' / '+i.stage)+' · '+esc(i.catalogId)+'</p><p>Catalog quantity: '+esc(shownQuantity([i]).text)+' '+esc(i.unit)+'</p><form id="progressForm" class="field-edit"><label>Site quantity<input name="quantity" type="number" min="0" step="any" value="'+esc(p.quantity??'')+'" placeholder="Unknown"></label><label><input name="done" type="checkbox"'+(p.done?' checked':'')+'>Checked</label><button type="submit" class="quiet">Save</button></form><p class="note">Changes are saved in this browser. Export a CSV to share them.</p>';$('detail').showModal();$('progressForm').onsubmit=e=>{e.preventDefault();const form=e.currentTarget,q=form.elements.quantity.value.trim();if(q!==''&&(!Number.isFinite(Number(q))||Number(q)<0))return;progress[id]={quantity:q===''?null:Number(q),done:form.elements.done.checked};saveProgress();$('detail').close();render()}}
const mobileNavigation=matchMedia('(max-width:800px)');
function setNavigationOpen(open){document.querySelector('.shell').classList.toggle('nav-open',open);$('navToggle').setAttribute('aria-expanded',String(open));$('sidebar').inert=mobileNavigation.matches?!open:document.querySelector('.shell').classList.contains('rail-hidden');if(open)$('navClose').focus();else $('navToggle').focus()}
function setRailCollapsed(collapsed,focus){const shell=document.querySelector('.shell');shell.classList.toggle('rail-hidden',collapsed);$('railOpen').setAttribute('aria-expanded',String(!collapsed));$('railClose').setAttribute('aria-expanded',String(!collapsed));$('sidebar').inert=mobileNavigation.matches?!shell.classList.contains('nav-open'):collapsed;try{localStorage.setItem('sitebom.sidebar.collapsed',String(collapsed))}catch{}if(focus)(collapsed?$('railOpen'):$('railClose')).focus()}
$('railOpen').onclick=()=>setRailCollapsed(false,true);$('railClose').onclick=()=>setRailCollapsed(true,true);
try{setRailCollapsed(localStorage.getItem('sitebom.sidebar.collapsed')==='true',false)}catch{setRailCollapsed(false,false)}
mobileNavigation.addEventListener('change',()=>{document.querySelector('.shell').classList.remove('nav-open');$('navToggle').setAttribute('aria-expanded','false');$('sidebar').inert=mobileNavigation.matches||document.querySelector('.shell').classList.contains('rail-hidden')});
$('sidebar').inert=mobileNavigation.matches||document.querySelector('.shell').classList.contains('rail-hidden');
$('navToggle').onclick=()=>setNavigationOpen(true);
$('navClose').onclick=()=>setNavigationOpen(false);
$('navScrim').onclick=()=>setNavigationOpen(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.shell').classList.contains('nav-open'))setNavigationOpen(false)});
document.querySelector('.appbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.id==='navClose')return;if(b.hasAttribute('data-code-index'))openCodeIndex();else if(b.hasAttribute('data-root'))openFolder([b.dataset.root]);else if(b.dataset.view){state.view=b.dataset.view;if(state.view==='catalog')openFolder([]);else render()}if(matchMedia('(max-width:800px)').matches)setNavigationOpen(false);});
$('viewModes').addEventListener('click',e=>{const b=e.target.closest('[data-presentation]');if(!b)return;state.presentation=b.dataset.presentation;state.path=[];state.query='';$('search').value='';if(state.presentation==='ordering'||state.presentation==='grid')state.phase='';else if(!state.phase)state.phase='Foundation';render()});
$('phases').addEventListener('click',e=>{const b=e.target.closest('[data-phase]');if(b){state.phase=b.dataset.phase;state.path=[];state.query='';$('search').value='';render()}});
$('content').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-print'))printPhase();else if(b.hasAttribute('data-export-progress'))exportProgress();else if(b.hasAttribute('data-code-index'))openCodeIndex();else if(b.hasAttribute('data-detail'))openItem(b.dataset.detail);else if(b.dataset.item)openProgress(b.dataset.item);else if(b.hasAttribute('data-folder'))openFolder([...state.path,b.dataset.folder]);else if(b.hasAttribute('data-depth'))openFolder(state.path.slice(0,Number(b.dataset.depth)));else if(b.hasAttribute('data-reset')){state.phase='';state.query='';$('search').value='';render()}else if(b.hasAttribute('data-doc-folder')){state.docPath.push(b.dataset.docFolder);state.docQuery='';render()}else if(b.hasAttribute('data-doc-depth')){state.docPath=state.docPath.slice(0,Number(b.dataset.docDepth));state.docQuery='';render()}});
$('search').oninput=e=>{state.query=e.target.value;render()};$('close').onclick=()=>$('detail').close();
$('detail').addEventListener('click',e=>{if(e.target!==$('detail'))return;const r=$('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('detail').close()});
$('version').textContent='Catalog v'+data.catalogVersion;render();
</script></body></html>
