name: Site BOM validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm.cmd run check
      - name: Publish versioned Site BOM exports
        uses: actions/upload-artifact@v4
        with:
          name: neovi-site-bom-${{ github.sha }}
          path: outputs/site-bom-v*/
          if-no-files-found: error
