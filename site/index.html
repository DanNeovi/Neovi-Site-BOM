<script>
'use strict';

const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=value=>value.replace(/([a-z])([A-Z])/g,'$1 $2').replaceAll('_',' ').replace(/^./,c=>c.toUpperCase());
const state={presentation:'phase',view:'catalog',path:[],phase:'',query:'',docPath:[],docQuery:''};
const progressKey='neovi-site-bom-progress-v1';
let progress={};try{progress=JSON.parse(localStorage.getItem(progressKey)||'{}')||{}}catch{}
function saveProgress(){try{localStorage.setItem(progressKey,JSON.stringify(progress))}catch{}}
function progressFor(i){return progress[i.lineId]||{}}
function csvCell(value){return '"'+String(value??'').replaceAll('"','""')+'"'}
function exportProgress(){const rows=[['Line ID','Item','Phase','Work area','Listed quantity','Site quantity','Unit','Checked']];for(const i of data.items){const p=progressFor(i);rows.push([i.lineId,i.description,i.phase,i.stage,i.listedQuantity??'',p.quantity??'',i.unit,p.done?'Yes':'No'])}const blob=new Blob([rows.map(row=>row.map(csvCell).join(',')).join('\r\n')+'\r\n'],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Neovi-Site-BOM-Progress.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const itemPath=i=>i.categoryPath?.length?i.categoryPath:['Uncategorized'];
const startsWith=(path,prefix)=>prefix.every((part,n)=>path[n]===part);
const topFolders=[...new Set(data.items.map(i=>itemPath(i)[0]))].sort();
const sheetReferenceCounts=new Map();for(const i of data.items){if(i.checklistSource&&i.originalLineId)sheetReferenceCounts.set(i.originalLineId,(sheetReferenceCounts.get(i.originalLineId)||0)+1)}

const codeIndex={EQUIP:['Equipment','Site equipment and rentals'],SUP:['Supplies','Marking and layout supplies'],TOOL:['Tools','Hand tools, power tools, and tool accessories'],MAT:['Materials','Building materials, installed components, and material consumables'],FIX:['Fixtures','Drill pedestals and fixtures that support or position tools'],FAST:['Fasteners','Screws, bolts, nuts, washers, pins, and connecting hardware'],RIG:['Rigging','Lifting chains, slings, and straps'],SHEET:['Sheet entry','An entry transcribed from your supplied BOM sheet; not a permanent catalog ID']};
function openCodeIndex(){ $('detailContent').innerHTML='<h2 id="detailTitle">Catalog code index</h2><p class="intro">The prefix identifies the item type. The number identifies the catalog entry; it is not a quantity or installation step.</p><div class="tablewrap"><table><thead><tr><th>Code</th><th>Meaning and use</th></tr></thead><tbody>'+Object.entries(codeIndex).map(([code,[name,description]])=>'<tr><td><strong>'+code+'</strong></td><td><strong>'+name+'</strong><small>'+description+'</small></td></tr>').join('')+'</tbody></table></div><p class="note">For example, EQUIP-1 is equipment entry 1. FIX means a tool-support fixture, not a plumbing fixture.</p>';$('detail').showModal()}

function fields(obj){return '<dl>'+Object.entries(obj).map(([k,v])=>'<dt>'+esc(label(k))+'</dt><dd>'+esc(v==null?'Not supplied':typeof v==='object'?JSON.stringify(v,null,2):typeof v==='boolean'?(v?'Yes':'No'):v===''?'Not supplied':v)+'</dd>').join('')+'</dl>'}
function selectedItems(){return data.items.filter(i=>startsWith(itemPath(i),state.path)&&(!state.phase||i.phase===state.phase)&&(!state.query||[i.description,i.catalogId,i.stage,i.kitId,i.system,i.specification,usedFor(i),...itemPath(i)].join(' ').toLowerCase().includes(state.query.toLowerCase())))}
function openFolder(path){state.view='catalog';state.path=path;state.query='';$('search').value='';render()}
function crumbs(path,attr,root){return '<div class="breadcrumbs" aria-label="Folder path"><button '+attr+'="0">'+root+'</button>'+path.map((part,n)=>'<span>/</span><button '+attr+'="'+(n+1)+'"'+(n===path.length-1?' aria-current="page"':'')+'>'+esc(part)+'</button>').join('')+'</div>'}
function folder(name,count,attr,value){return '<button class="folder" '+attr+'="'+esc(value)+'"><span class="folder-icon" aria-hidden="true"></span><strong>'+esc(name)+'</strong><small>'+count+'</small></button>'}
function sourceOrder(a,b){for(let n=0;n<Math.max(a.sourceOrdinal?.length||0,b.sourceOrdinal?.length||0);n++){const difference=(a.sourceOrdinal?.[n]??0)-(b.sourceOrdinal?.[n]??0);if(difference)return difference}return a.lineId.localeCompare(b.lineId)}
function groupedSystems(items){const groups=new Map();items.forEach(i=>{const key=i.system||'General';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(i)});return [...groups.values()].flat()}
function usedFor(item){return [...new Set([item.usedFor,item.usageDescription,item.itemNotes,item.lineNotes].filter(v=>typeof v==='string'&&v.trim()).map(v=>v.trim()))].join(' ')||'N/A'}


const formulaDrivers={pileProxy:['pile positions','pile position'],trussCount:['trusses','truss'],floorArea:['livable SQFT','livable SQFT'],firstStoryArea:['first-story SQFT','first-story SQFT'],secondStoryArea:['second-story SQFT','second-story SQFT'],roofProxyArea:['roof SQFT','roof SQFT'],wallLength:['wall FT','wall FT'],firstStoryWallLength:['first-story wall FT','first-story wall FT'],secondStoryWallLength:['second-story wall FT','second-story wall FT'],exteriorLength:['exterior-wall FT','exterior-wall FT'],hssBeams:['foundation HSS beams','HSS beam'],floorPlates:['floor plates','floor plate'],holdDowns:['hold-downs','hold-down'],garageArea:['garage SQFT','garage SQFT'],trussFinishBoardArea:['truss-finish board SQFT','truss-finish board SQFT']};
function readableFormula(formula){let result=formula.replace(/^ceil_to_([\d.]+)\((.*)\) = (.*)$/,(all,step,calculation,total)=>calculation+' = '+total+' (round up to '+step+')');for(const [driver,[plural,singular]] of Object.entries(formulaDrivers)){result=result.replaceAll('/'+driver,' per '+singular).replaceAll(driver,plural)}return result.replaceAll(' x ',' × ').replace(/\b(EA|FT|SQFT|CUFT|LB|OZ|DAY)\//g,'$1 per ')}
function monroeDetails(item){const m=item.monroeEstimate;if(!m)return '';const a=m.averageMetrics||{},num=value=>Number(value).toLocaleString('en-US',{maximumFractionDigits:6});const kind=m.basis==='PLANNING_PLACEHOLDER'?'Undefined item':m.basis==='PLANNING_CONDITIONAL_ZERO'?'Conditional zero':m.basis.startsWith('PLANNING_')?'Planning estimate':m.basis==='CONFIRMED_STANDARD'?'Confirmed standard':m.basis==='CATALOG_FIXED_ALLOWANCE'?'Catalog allowance':'Model based';const repeated=item.checklistSource&&sheetReferenceCounts.get(item.originalLineId)>1;const scopeNote=repeated?'<p class="calc-assumption">This is the catalog-wide estimate shared by several sheet uses; do not add it once per use.</p>':'';const metrics={baseKit:num(m.baseKitQuantity)+' '+m.unit};if(a.primaryDriver&&a.primaryDriver!=='project')metrics.averagePerDriver=num(a.averagePerPrimaryDriver)+' '+m.unit+' / '+a.primaryDriverUnit;if(a.averagePerLivableSqft!=null)metrics.averagePerLivableSqft=num(a.averagePerLivableSqft)+' '+m.unit+'/SQFT';if(m.storyAllocation){metrics.firstStory=num(m.storyAllocation['FIRST FLOOR']?.quantity)+' '+m.unit;metrics.secondStory=num(m.storyAllocation['SECOND FLOOR']?.quantity)+' '+m.unit}return '<div class="calc-panel"><h4>How calculated <span class="calc-kind">· '+esc(kind)+'</span></h4><div class="calc-equation">'+esc(readableFormula(m.formula))+'</div><p class="calc-assumption">'+esc(m.assumption)+'</p>'+scopeNote+'</div><details><summary>Rates, kit and full evidence</summary>'+fields(metrics)+'<p class="note"><a href="05-Monroe/Monroe-Item-Formulas.md" target="_blank" rel="noopener">Open all Monroe formulas and source references</a></p></details>'}
function inlineDetails(items){const unique=[...new Map(items.filter(i=>i.monroeEstimate).map(i=>[i.originalLineId||i.lineId,i])).values()];const estimate=unique.map(monroeDetails).join('');const noEstimate=!estimate?'<p class="note">No Monroe quantity is available for this exact item.</p>':'';const catalog=items.map(i=>'<h4>'+esc(i.catalogId)+' · '+esc(i.description)+'</h4>'+fields({workArea:i.phase+' / '+i.stage,providedQuantity:i.checklistSource?(i.listedQuantity??'N/A'):'Not a sheet entry',specification:i.specification||'Pending',usedFor:usedFor(i),vendor:i.vendor||'Pending',partNumber:i.partNumber||'Pending'})).join('');return '<div class="inline-info">'+estimate+noEstimate+'<details><summary>Specification and catalog details</summary>'+catalog+'</details></div>'}
function compactList(items){return '<div class="compact-list">'+items.map(i=>{const qty=shownQuantity([i]),p=progressFor(i);return '<details class="material-entry"><summary><span>'+esc(i.description)+(p.done?' <span class="field-done">✓</span>':'')+'<small>'+esc(i.catalogId)+'</small></span><span class="entry-unit">'+esc(p.quantity??qty.text)+'<small>'+esc(i.unit+' · '+(p.quantity!=null?'site entry':qty.source))+'</small></span></summary>'+inlineDetails([i])+'<button class="quiet" data-item="'+esc(i.lineId)+'">Edit site progress</button></details>'}).join('')+'</div>'}
function checklistGroup(i){if(i.checklistGroup)return i.checklistGroup;if(i.inventoryPrefix==='EQUIP')return 'Equipment';if(i.inventoryPrefix==='RIG')return 'Supplemental';if(i.inventoryPrefix==='SUP'||/sealant|cutting fluid|drill.bit|annular|chalk.line refill/i.test(i.description)||(/foam/i.test(i.description)&&!/gun|applicator|cleaner/i.test(i.description)))return 'Consumables';if(['TOOL','FIX'].includes(i.inventoryPrefix))return 'Tools';return 'Materials'}
function table(items,showEmptyMaterials=false){const groupNames=['Site services','Equipment','Supplemental','Materials','Tools','Consumables'];const grouped=new Map(groupNames.map(name=>[name,items.filter(i=>checklistGroup(i)===name)]));const section=name=>{const rows=grouped.get(name);return rows.length||(showEmptyMaterials&&name==='Materials')?'<section class="package-column"><h3 class="type-heading">'+name+' <small>'+rows.length+'</small><span>Qty</span></h3>'+compactList(rows)+'</section>':''};return '<div class="package-columns"><div class="package-stack">'+['Site services','Equipment','Supplemental'].map(section).join('')+'</div>'+['Materials','Tools','Consumables'].map(name=>'<div class="package-stack">'+section(name)+'</div>').join('')+'</div>'}
function listedQty(rows){const known=rows.filter(i=>i.listedQuantity!=null);if(!known.length)return 'N/A';const sum=known.reduce((n,i)=>n+i.listedQuantity,0);return String(sum)+(known.length<rows.length?' + N/A':'')}
const qtyNumber=value=>Number(value).toLocaleString('en-US',{maximumFractionDigits:3});
function rowQuantity(item){const entered=progressFor(item).quantity;if(entered!=null)return {value:entered,source:'site entry'};if(item.checklistSource&&item.listedQuantity!=null)return {value:item.listedQuantity,source:'user supplied'};const estimate=item.monroeEstimate;if(estimate&&estimate.basis!=='PLANNING_PLACEHOLDER'&&(!item.checklistSource||sheetReferenceCounts.get(item.originalLineId)===1))return {value:estimate.quantity,source:estimate.basis==='PLANNING_CONDITIONAL_ZERO'?'Monroe conditional':'Monroe estimate'};return {value:null,source:'not estimated'}}
function shownQuantity(rows){const values=rows.map(rowQuantity),known=values.filter(v=>v.value!=null);if(!known.length){const first=rows[0];if(rows.length>1&&first.checklistSource&&first.originalLineId&&rows.every(r=>r.checklistSource&&r.originalLineId===first.originalLineId&&r.monroeEstimate&&r.monroeEstimate.basis!=='PLANNING_PLACEHOLDER'))return {text:qtyNumber(first.monroeEstimate.quantity),source:'Monroe shared total'};return {text:'N/A',source:'not estimated'}}const bySource=new Map();for(const item of known)bySource.set(item.source,(bySource.get(item.source)||0)+item.value);const unknown=rows.length-known.length;const parts=[...bySource].map(([source,value])=>bySource.size===1?qtyNumber(value):qtyNumber(value)+' '+source);return {text:parts.join(' + ')+(unknown?' + N/A':''),source:bySource.size===1?known[0].source:'mixed sources'}}
const normalized=value=>String(value||'').toLowerCase().replace(/\s+/g,' ').trim();
const specified=value=>Boolean(normalized(value))&&!/tbd|confirm|not specified|not supplied|unspecified|n\/a|approve exact|pending|placeholder|remaining specification|selected|match voltage|compatible with/i.test(value);
function purchaseKey(i){const unit=normalized(i.unit),prefix=i.inventoryPrefix||'';if(i.purchaseType)return JSON.stringify(['sheet-type',i.purchaseType,unit]);if(specified(i.partNumber))return JSON.stringify(['part',specified(i.vendor)?normalized(i.vendor):(i.lineId||i.itemId||i.description),normalized(i.partNumber),unit]);if(specified(i.specification))return JSON.stringify(['spec',prefix,purchaseFamily(i),normalized(i.specification),unit]);return JSON.stringify(['name',prefix,normalized(i.vendor),normalized(i.description),unit])}
function purchaseGroups(items){const groups=new Map();items.forEach(i=>{const key=purchaseKey(i);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(i)});return [...groups.values()]}
function purchaseFamily(i){const name=i.description.toLowerCase();if(/screw(?!driver)/.test(name))return 'Screws';if(/washers.*nuts|nuts.*washers/.test(name))return 'Washer and nut sets';if(/\bwashers?\b/.test(name))return 'Washers';if(/\bnuts?\b/.test(name))return 'Nuts';if(/\bbolts?\b/.test(name))return 'Bolts';if(/froth.?pak|foam/.test(name))return 'Foam and applicator supplies';return codeIndex[i.inventoryPrefix]?.[0]||'Other parts'}
function orderingList(items){const placeholders=items.filter(i=>/^Define\b/i.test(i.description));items=items.filter(i=>!/^Define\b/i.test(i.description));const families=new Map();purchaseGroups(items).forEach(rows=>{const family=purchaseFamily(rows[0]);if(!families.has(family))families.set(family,[]);families.get(family).push(rows)});return '<p class="note">All phases combined by part type. Quantities labeled Monroe estimate are project planning values, not approved order quantities. User-provided quantities retain their listed values. N/A remains where no defensible value exists; repeated sheet uses of one catalog item share a single Monroe total.</p>'+[...families].sort(([a],[b])=>a.localeCompare(b)).map(([name,entries])=>'<h2 class="group-title">'+esc(name)+' <span class="group-count">'+entries.length+' ordering entries</span></h2><div class="compact-list">'+entries.sort((a,b)=>a[0].description.localeCompare(b[0].description)).map(rows=>{const i=rows[0],title=rows.length>1&&specified(i.partNumber)?i.partNumber:rows.length>1&&specified(i.specification)?i.specification:i.description,qty=shownQuantity(rows);return '<details class="material-entry"><summary><span>'+esc(title)+'<small>'+esc([...new Set(rows.map(r=>r.phase+' / '+r.stage))].join(' ; '))+' / '+rows.length+' use'+(rows.length===1?'':'s')+(!specified(i.specification)&&!specified(i.partNumber)?' / Specification needed':'')+'</small></span><span class="entry-unit">'+esc(qty.text)+'<small>'+esc(i.unit+' · '+qty.source)+'</small></span></summary>'+rows.map(row=>'<p class="source-item">'+esc(row.catalogId)+' / '+esc(row.description)+'</p>').join('')+inlineDetails(rows)+'</details>'}).join('')+'</div>').join('')+(placeholders.length?'<details class="extra-catalog"><summary>Items still to define ('+placeholders.length+')</summary>'+compactList(placeholders)+'</details>':'')}
function printPhase(){
 if(!state.phase&&state.presentation!=='ordering'&&data.siteProject!=='Monroe')return;
 const saved={...state,path:[...state.path]},title=document.title;
 try{
  state.path=[];state.query='';render();
  $('printReport').innerHTML='<header><p>Site Bill of Material</p><h1>'+esc(state.phase||(state.presentation==='ordering'?'Combined ordering list':'Monroe · all items'))+'</h1><p>'+data.items.filter(i=>!state.phase||i.phase===state.phase).length+' materials / Catalog snapshot '+esc(new Date(data.viewerGeneratedAt||data.generatedAt).toLocaleDateString())+'</p></header>'+$('content').innerHTML+'<footer class="print-legend"><strong>Code index:</strong> '+Object.entries(codeIndex).map(([code,[name]])=>esc(code)+' = '+esc(name)).join(' / ')+'</footer>';
 }finally{Object.assign(state,saved);render()}
 $('printReport').querySelectorAll('details').forEach(d=>d.open=true);
 document.title='Monroe Site BOM - '+(state.phase||'All items');
 try{window.print()}finally{document.title=title;$('printReport').innerHTML=''}
}

 $('navigation').innerHTML='<button data-view="catalog" class="'+(state.view==='catalog'?'active':'')+'">Catalog</button>'+topFolders.map(f=>'<button class="nav-folder" data-root="'+esc(f)+'"'+(state.view==='catalog'&&state.path[0]===f?' aria-current="page"':'')+'>'+esc(f)+'</button>').join('')+'<div class="eyebrow nav-label">Resources</div><button data-code-index>Code index</button><button data-view="documents" class="'+(state.view==='documents'?'active':'')+'">Documents</button><button data-view="reference" class="'+(state.view==='reference'?'active':'')+'">How to use</button>';
 $('materialControls').hidden=state.view!=='catalog';
 $('viewModes').innerHTML=[['ordering','Combined ordering list'],['phase','By phase: tools & materials']].map(([value,name])=>'<button data-presentation="'+value+'" class="'+(state.presentation===value?'active':'')+'" aria-pressed="'+(state.presentation===value)+'">'+name+'</button>').join('');
 $('phases').hidden=state.presentation==='ordering';
 $('heading').textContent=state.view==='catalog'?(state.presentation==='ordering'?'Combined ordering list':state.path.at(-1)||state.phase||'Monroe · all items'):state.view==='documents'?'Documents':'How to use';
 $('intro').textContent=state.view==='catalog'?(state.phase?'Full phase inventory, organized using the BOM Skeleton layout. Work packages show all materials, tools, and consumables; click an item for details.':(state.presentation==='ordering'?'Matching parts combined across work areas, with quantities from your checklist and later directions.':'All Monroe Site BOM items across Site Setup, Foundation, Panels, and Finishing. Quantities are labeled by source and are planning values until reviewed.')):state.view==='documents'?'Browse supporting files by folder. Older catalog and project exports do not include the BOM Skeleton checklist additions.':'Find materials, specifications, and catalog information.';
 $('footnote').textContent='Catalog snapshot: '+new Date(data.viewerGeneratedAt||data.generatedAt).toLocaleDateString()+'.';
 if(state.view==='documents'){$('content').innerHTML='<div class="controls"><input id="docSearch" type="search" aria-label="Search documents" placeholder="Search files in this folder..." value="'+esc(state.docQuery)+'"></div><div id="docList"></div>';renderDocs();$('docSearch').oninput=e=>{state.docQuery=e.target.value;renderDocs()};return}
 if(state.view==='reference'){$('content').innerHTML='<div class="reference"><h2>Everything in its folder</h2><p>Start with a catalog folder, then open its subfolders to find related materials. The folder path above the contents takes you back to any parent folder.</p><p>Select Foundation, Panels, or Finishing to see every material in that phase immediately, grouped by work area in installation order. Search looks through the current folder and all its subfolders.</p><p>Open Edit site progress beneath an item to enter a site quantity or check it off. Progress is saved in this browser; export the CSV to share it. Catalog estimates stay unchanged.</p><p>Select a material for its specification, vendor, part number, and catalog rules. Documents are also organized into folders.</p></div>';return}
 $('phases').innerHTML=['',...new Set(data.items.map(i=>i.phase))].map(p=>'<button data-phase="'+esc(p)+'" aria-pressed="'+(p===state.phase)+'" class="'+(p===state.phase?'active':'')+'">'+esc(p||'All phases')+'</button>').join('');
 const items=selectedItems(),depth=state.path.length,children=[...new Set(items.map(i=>itemPath(i)[depth]).filter(Boolean))].sort();
 let body=crumbs(state.path,'data-depth','Catalog')+'<div class="listhead"><span role="status">'+items.length+' entries'+(state.phase?' / '+esc(state.phase):'')+' · '+items.filter(i=>progressFor(i).done).length+' checked</span><div class="list-actions">'+(state.phase||state.presentation==='ordering'?'<button class="quiet" data-print>Print / Save PDF - '+esc(state.phase||'All items')+'</button>':'')+'<button class="quiet" data-export-progress>Export progress CSV</button><button class="quiet" data-code-index>Code index</button><button class="quiet" data-reset>Reset filters</button></div></div>';
 if(items.some(i=>i.checklistSource))body+='<p class="note">Quantity source appears below each number. User-provided values are preserved; Monroe estimates fill uniquely mapped blanks. Unlinked or ambiguous entries remain N/A.</p>';
 if(!items.length)body+='<div class="empty">No matching materials. Try another search or reset the filters.</div>';
 else if(state.presentation==='ordering'){body+=orderingList(items)}
 else if(state.query||state.phase||data.siteProject==='Monroe'){const groups=new Map();const ordered=[...items].sort((a,b)=>(a.phaseOrder??999)-(b.phaseOrder??999)||(a.stageOrder??999)-(b.stageOrder??999)||sourceOrder(a,b));ordered.forEach(i=>{const key=i.phase+' / '+(i.stage||'Unassigned work area');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(i)});body+='<div class="stage-links" aria-label="Jump to work area">'+[...groups].map(([name,rows],n)=>'<a href="#work-area-'+n+'">'+esc(state.phase?rows[0].stage:name)+' <small>'+rows.length+'</small></a>').join('')+'</div>';body+=[...groups].map(([name,rows],n)=>'<section id="work-area-'+n+'" class="work-area"><h2 class="group-title">'+esc(name)+' <span class="group-count">'+rows.length+' entries</span></h2>'+table(rows,name==='Foundation / Shared Foundation Support')+'</section>').join('')}

 else{body+='<div class="folder-grid">'+children.map(name=>folder(name,items.filter(i=>itemPath(i)[depth]===name).length+' materials','data-folder',name)).join('')+'</div>';const direct=items.filter(i=>itemPath(i).length===depth);if(direct.length)body+='<h2 class="group-title">Materials in this folder</h2>'+table(direct)}
 $('content').innerHTML=body;
}
// Project reports remain in the delivery package; this catalog only lists shared resources.
const documents=data.documents.filter(d=>!d.path.startsWith('02-Projects/'));
function renderDocs(){const depth=state.docPath.length,docs=documents.filter(d=>startsWith(d.path.split('/'),state.docPath)&&d.path.toLowerCase().includes(state.docQuery.toLowerCase()));const folders=[...new Set(docs.filter(d=>d.path.split('/').length>depth+1).map(d=>d.path.split('/')[depth]))].sort();const files=state.docQuery?docs:docs.filter(d=>d.path.split('/').length===depth+1);
 $('docList').innerHTML=crumbs(state.docPath,'data-doc-depth','Documents')+'<div class="listhead" role="status">'+docs.length+' files</div>'+(!state.docQuery?'<div class="folder-grid">'+folders.map(f=>folder(f.replace(/^\d+-/,''),docs.filter(d=>d.path.split('/')[depth]===f).length+' files','data-doc-folder',f)).join('')+'</div>':'')+'<div class="docs">'+files.map(d=>'<a class="doc" href="'+d.path.split('/').map(encodeURIComponent).join('/')+'" target="_blank" rel="noopener"><small>'+esc(d.path.split('/').slice(0,-1).join(' / '))+'</small>'+esc(d.name)+'</a>').join('')+'</div>'+(!docs.length?'<div class="empty">No matching documents.</div>':'')}
function openItem(id){const i=data.items.find(i=>i.lineId===id);$('detailContent').innerHTML='<div class="eyebrow">'+esc(i.catalogId)+' / '+esc(i.phase)+'</div><h2 id="detailTitle">'+esc(i.description)+'</h2><p class="intro">'+esc(itemPath(i).join(' / '))+'</p><h3>Used for / notes</h3><p class="usage-description">'+esc(usedFor(i))+'</p><h3>Belongs to</h3>'+fields({phase:i.phase,workArea:i.stage,system:i.system,kit:i.kitId,siteTeam:i.siteTeam,deliveryStage:i.deliveryStage})+'<h3>Specification</h3>'+fields({specification:i.specification,approved:i.specificationApproved,unit:i.unit,vendor:i.vendor,partNumber:i.partNumber})+'<details><summary>Catalog information</summary>'+fields({system:i.system,owner:i.owner,procurementMethod:i.procurementMethod,itemNotes:i.itemNotes,lineNotes:i.lineNotes})+'</details><details><summary>Quantity rules</summary>'+fields({quantityBasis:i.quantityBasis,takeoffFormula:i.takeoffFormula,packSize:i.packSize,ruleStatus:i.ruleStatus})+'</details><details><summary>Advanced catalog data</summary>'+fields(i)+'</details>';$('detail').showModal()}
function openProgress(id){const i=data.items.find(row=>row.lineId===id),p=progressFor(i);$('detailContent').innerHTML='<h2 id="detailTitle">'+esc(i.description)+'</h2><p class="intro">'+esc(i.phase+' / '+i.stage)+' · '+esc(i.catalogId)+'</p><p>Catalog quantity: '+esc(shownQuantity([i]).text)+' '+esc(i.unit)+'</p><form id="progressForm" class="field-edit"><label>Site quantity<input name="quantity" type="number" min="0" step="any" value="'+esc(p.quantity??'')+'" placeholder="Unknown"></label><label><input name="done" type="checkbox"'+(p.done?' checked':'')+'>Checked</label><button type="submit" class="quiet">Save</button></form><p class="note">Changes are saved in this browser. Export a CSV to share them.</p>';$('detail').showModal();$('progressForm').onsubmit=e=>{e.preventDefault();const form=e.currentTarget,q=form.elements.quantity.value.trim();if(q!==''&&(!Number.isFinite(Number(q))||Number(q)<0))return;progress[id]={quantity:q===''?null:Number(q),done:form.elements.done.checked};saveProgress();$('detail').close();render()}}
$('navigation').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-code-index'))openCodeIndex();else if(b.hasAttribute('data-root'))openFolder([b.dataset.root]);else if(b.dataset.view){state.view=b.dataset.view;if(state.view==='catalog')openFolder([]);else render()}});
$('viewModes').addEventListener('click',e=>{const b=e.target.closest('[data-presentation]');if(!b)return;state.presentation=b.dataset.presentation;state.path=[];state.query='';$('search').value='';if(state.presentation==='ordering')state.phase='';else if(data.siteProject!=='Monroe'&&!state.phase)state.phase='Foundation';render()});
$('phases').addEventListener('click',e=>{const b=e.target.closest('[data-phase]');if(b){state.phase=b.dataset.phase;state.path=[];state.query='';$('search').value='';render()}});
$('content').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-print'))printPhase();else if(b.hasAttribute('data-export-progress'))exportProgress();else if(b.hasAttribute('data-code-index'))openCodeIndex();else if(b.dataset.item)openProgress(b.dataset.item);else if(b.hasAttribute('data-folder'))openFolder([...state.path,b.dataset.folder]);else if(b.hasAttribute('data-depth'))openFolder(state.path.slice(0,Number(b.dataset.depth)));else if(b.hasAttribute('data-reset')){state.phase='';state.query='';$('search').value='';render()}else if(b.hasAttribute('data-doc-folder')){state.docPath.push(b.dataset.docFolder);state.docQuery='';render()}else if(b.hasAttribute('data-doc-depth')){state.docPath=state.docPath.slice(0,Number(b.dataset.docDepth));state.docQuery='';render()}});
$('search').oninput=e=>{state.query=e.target.value;render()};$('close').onclick=()=>$('detail').close();
$('detail').addEventListener('click',e=>{if(e.target!==$('detail'))return;const r=$('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('detail').close()});
$('version').textContent='Catalog v'+data.catalogVersion;render();
</script><script src="live-config.js"></script><script src="live-site.js"></script></body></html>
